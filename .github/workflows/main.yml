name: Build Pocket Money Tracker APK

on:
workflow_dispatch:
push:
paths:
- '.github/workflows/main.yml'
- '*.zip'

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Set up Gradle 8.9
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Find and extract project ZIP
    shell: bash
    run: |
      set -euo pipefail

      ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'PocketMoneyTracker*.zip' -print -quit)"

      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: Upload the PocketMoneyTracker project ZIP to the repository root."
        exit 1
      fi

      mkdir project-src
      unzip -q "$ZIP_FILE" -d project-src

      if [ ! -f project-src/settings.gradle ] && [ ! -f project-src/settings.gradle.kts ]; then
        echo "ERROR: settings.gradle was not found at the expected location."
        find project-src -maxdepth 4 -type f | head -80
        exit 1
      fi

      if [ ! -f project-src/app/build.gradle ] && [ ! -f project-src/app/build.gradle.kts ]; then
        echo "ERROR: app/build.gradle was not found at the expected location."
        exit 1
      fi

  - name: Build debug APK
    run: gradle --no-daemon -p project-src :app:assembleDebug

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: PocketMoneyTracker-debug-apk
      path: project-src/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
