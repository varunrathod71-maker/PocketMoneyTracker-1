
name: Build Pocket Money Tracker APK

'on':
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'PocketMoneyTracker*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No PocketMoneyTracker ZIP found in the repository root."
            exit 1
          fi

          mkdir project-src
          unzip -q "$ZIP_FILE" -d project-src

          if [ ! -f project-src/settings.gradle ] && [ ! -f project-src/settings.gradle.kts ]; then
            echo "ERROR: Project settings file not found."
            find project-src -maxdepth 4 -type f | head -80
            exit 1
          fi

          if [ ! -f project-src/app/build.gradle ] && [ ! -f project-src/app/build.gradle.kts ]; then
            echo "ERROR: App build file not found."
            exit 1
          fi

      - name: Build debug APK
        run: gradle --no-daemon -p project-src :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketMoneyTracker-debug-apk
          path: project-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
